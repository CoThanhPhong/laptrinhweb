<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phieu Dang Ky</title>
</head>
<body>
    <div>
        <table>
            <form>
                <tr>
                  <h1>Registration Form</h1>  
                </tr>
                <tr>
                    <td>
                        <label>First Name:</label>
                    </td>
                    <td colspan="3">
                        <input type="text" name="fname" placeholder="Enter First Name">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Last Name:</label>
                    </td>
                    <td colspan="3">
                        <input type="text" name="lname" placeholder="Enter Last Name">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Email:</label>
                    </td>
                    <td colspan="3">
                        <input type="text" name="email" placeholder="Enter Email Address">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Password:</label>
                    </td>
                    <td colspan="3" >
                        <input type="password" name="pwd">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Gender:</label>
                    </td>
                    <td>
                        <input type="radio" name="gender">
                        <label>Male</label>
                        <input type="radio" name="gender">
                        <label>Female</label>
                        <input type="radio" name="gender">
                        <label>Other</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Age:</label>
                    </td>
                    <td colspan="3">
                        <input type="number" name="age">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Preferences:</label>
                    </td>
                    <td>
                        <label><input type="checkbox" name="o1">Acrylic Painting</label><br>
                        <label><input type="checkbox" name="o2">Oil Painting</label><br>
                        <label><input type="checkbox" name="o3">Water Color Painting</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Select Occuppation</label>
                    </td>
                    <td>
                        <select name="oc">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                            <option value="other">Other</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Bio</label>
                    </td>
                    <td>
                        <textarea name="bio" rows="5" placeholder="Share few lines about yourself..."></textarea>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="reset" value="Reset">
                        <input type="submit" value="Submit">
                    </td>
                </tr>
            </form>
        </table>
    </div>
</body>
</html>
