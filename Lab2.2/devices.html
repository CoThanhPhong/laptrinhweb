<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices</title>
</head>
<body>
    <div>
        <table border="1">
            <tr style="background-color: aqua;">
                <th>Device</th>
                <th>Brand</th>
                <th colspan="2">Specifications</th>
            </tr>
            <tr>
                <td rowspan="3">Smartphone</td>
                <td rowspan="3">Apple</td>
                <td style="background-color: darkgoldenrod;">Model</td>
                <td style="background-color: darkgoldenrod;">Storage</td>
            </tr>
            <tr>
                <td>iPhone 12 Pro</td>
                <td>256GB</td>
            </tr>
            <tr>
                <td>iPhone SE</td>
                <td>128GB</td>
            </tr>
            <tr>
                <td>Laptop</td>
                <td>HP</td>
                <td colspan="2">15.6" Display</td>
            </tr>
            <tr>
                <td>Tablet</td>
                <td>Samsung</td>
                <td colspan="2">10.5" Display</td>
            </tr>
        </table>
    </div>
</body>
</html>
