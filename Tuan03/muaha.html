<html>
    <head>
        <title>Mùa hạ</title>
    </head>
    <body bgcolor="yellow">
        <center>
            <font color="blue" size="20">
                <p align="center">MÙA HẠ</p>
            </font>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="250" height="250">
                <!-- Nền mùa hạ -->
                <rect width="100" height="100" rx="20" fill="#e0f7fa" />
                
                <!-- Mặt trời -->
                <circle cx="50" cy="38" r="14" fill="#ffb300" />
                <!-- Tia nắng -->
                <path d="M50 18 V 12 M50 58 V 64 M30 38 H 24 M70 38 H 76 M36 24 L 31 19 M64 52 L 69 57 M36 52 L 31 57 M64 24 L 69 19" 
                        stroke="#ffa000" stroke-width="3.5" stroke-linecap="round" />
                
                <!-- Sóng biển -->
                <path d="M20 70 Q 35 60, 50 70 T 80 70" fill="none" stroke="#0288d1" stroke-width="4" stroke-linecap="round" />
                <path d="M20 78 Q 35 68, 50 78 T 80 78" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" />
            </svg>
            <font color="red" size="5">
                <p align="center">Mùa hạ là mùa đẹp nhất ...</p>
            </font>
        </center>
    </body>
</html>
