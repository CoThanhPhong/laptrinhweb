<html>
    <head>
        <title>Mùa đông</title>
    </head>
    <body bgcolor="lightblue">
        <center>
            <font color="blue" size="20">
                <p align="center">MÙA ĐÔNG</p>
            </font>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="250" height="250">
                <!-- Nền mùa đông -->
                <rect width="100" height="100" rx="20" fill="#e1f5fe" />
                
                <!-- Bông tuyết chính -->
                <g stroke="#0288d1" stroke-width="3.5" stroke-linecap="round">
                    <!-- Các trục chính -->
                    <line x1="50" y1="22" x2="50" y2="78" />
                    <line x1="22" y1="50" x2="78" y2="50" />
                    <line x1="30" y1="30" x2="70" y2="70" />
                    <line x1="30" y1="70" x2="70" y2="30" />
                    
                    <!-- Nhánh phụ -->
                    <path d="M44 28 L50 34 L56 28 M44 72 L50 66 L56 72" />
                    <path d="M28 44 L34 50 L28 56 M72 44 L66 50 L72 56" />
                </g>
                
                <!-- Tâm bông tuyết -->
                <circle cx="50" cy="50" r="3" fill="#0288d1" />
            </svg>
            <font color="red" size="5">
                <p align="center">Mùa đông là mùa đẹp nhất ...</p>
            </font>
        </center>
    </body>
</html>
